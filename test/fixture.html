<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Quality Guidance — local generic fixture</title>
<style>
:root{--primary-text-color:#f1e5cd;--secondary-text-color:#a99a84;--primary-color:#d3ad64;--wall-raised-background:#34291f;--secondary-background-color:#34291f;--divider-color:#67533e;font-family:Arial,sans-serif;background:#17120f;color:#f1e5cd}body{margin:20px}button,select{min-height:44px;padding:6px 12px;background:#34291f;color:#f1e5cd;border:1px solid #806d4f;border-radius:8px}header{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.layout{display:grid;grid-template-columns:minmax(0,480px) minmax(180px,1fr);gap:20px}.page,.wrapper{isolation:auto}.sample{width:min(100%,480px)}ha-card{display:block;border:1px solid #6a5233;border-radius:18px;box-sizing:border-box}ha-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;font-size:10px}.background-controls{padding:20px;border:1px solid #67533e;border-radius:18px}.background-controls button{pointer-events:none}@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}body{margin:12px}}
</style>
<header><strong>Generic local test data — no HA connection</strong><select id="scenario" aria-label="Scenario"><option>Normal</option><option>High CO2</option><option>Gas event</option><option>Primary missing</option><option>All unavailable</option></select><select id="height" aria-label="Scene height"><option>108</option><option selected>132</option><option>190</option></select><select id="width" aria-label="Card width"><option>320</option><option selected>480</option></select></header>
<div class="layout page"><div class="wrapper"><div class="sample" id="sample"></div></div><aside class="background-controls"><p>Inert background controls for overlay checks</p><button disabled>Example device — disabled</button><p>The open drawer must cover this panel.</p></aside></div>
<script type="module">
class Icon extends HTMLElement{connectedCallback(){this.textContent={'mdi:thermometer':'T','mdi:water-percent':'RH','mdi:molecule-co2':'CO₂','mdi:scent':'VOC','mdi:smog':'NOx'}[this.getAttribute('icon')]??'PM'}}customElements.define('ha-icon',Icon);
await import('../dist/air-quality-guidance-card.js');
const card=document.createElement('air-quality-guidance-card');document.querySelector('#sample').append(card);
const config={entity:'sensor.example_pm25',metric:'pm25',name:'Example Indoor Air',guidance:'all_available',co2:'sensor.example_co2',pm10:'sensor.example_pm10',pm1:'sensor.example_pm1',pm4:'sensor.example_pm4',voc:'sensor.example_voc',nox:'sensor.example_nox',temperature:'sensor.example_temperature',humidity:'sensor.example_humidity',chips:['temperature','humidity','co2','voc','nox']};
const unit={pm25:'µg/m³',pm10:'µg/m³',pm1:'µg/m³',pm4:'µg/m³',co2:'ppm',voc:'',nox:'',temperature:'°C',humidity:'%'};
let values={};
function update(){values={pm25:2.1,pm10:5,pm1:1,pm4:3,co2:750,voc:80,nox:1,temperature:21.7,humidity:40};const chosen=document.querySelector('#scenario').value;if(chosen==='High CO2')values.co2=1600;if(chosen==='Gas event')values.voc=300;if(chosen==='Primary missing')values.pm25='unavailable';if(chosen==='All unavailable')Object.keys(values).forEach(k=>values[k]='unavailable');
card.setConfig(config);const end=Math.floor(Date.now()/300000)*300000;
card.hass={locale:{language:'en'},entities:Object.fromEntries(Object.keys(values).map(k=>['sensor.example_'+k,{entity_id:'sensor.example_'+k,device_id:'example_device'}])),states:Object.fromEntries(Object.entries(values).map(([key,value])=>['sensor.example_'+key,{state:String(value),last_reported:new Date().toISOString(),last_updated:new Date().toISOString(),attributes:{friendly_name:'Example '+key,device_class:{co2:'carbon_dioxide',voc:null,nox:null}[key]??key,unit_of_measurement:unit[key]}}])),callWS:async request=>Object.fromEntries(request.statistic_ids.map(id=>[id,values[id.replace('sensor.example_','')]==='unavailable'?[]:Array.from({length:request.period==='day'?10:request.period==='hour'?240:288},(_,i)=>({start:request.period==='day'?end-(10-i)*86400000:request.period==='hour'?end-(240-i)*3600000:end-(288-i)*300000,mean:Number(values[id.replace('sensor.example_','')])||0,max:Number(values[id.replace('sensor.example_','')])||0}))]))};
const style=document.createElement('style');style.textContent=`.scene{height:${document.querySelector('#height').value}px}.head{padding:8px 12px 0;gap:8px}.name{font-size:12px;line-height:14px}.category{font-size:18px;line-height:20px;max-width:100%}.guidance{font-size:10px;line-height:11px;max-height:22px}.mascot-badge{width:40px;height:40px}.mascot{width:34px;height:34px}.strip{padding:5px 10px;gap:8px}.pm-value{font-size:22px}.chips{font-size:11px;gap:3px 8px}.sheet{background:#34291f!important;color:#f1e5cd}.tile{background:#493927}.guidance-details{border-color:#806d4f}`;card.shadowRoot.append(style);document.querySelector('#sample').style.width=document.querySelector('#width').value+'px';document.querySelector('#sample').style.maxWidth='100%';}
for(const el of document.querySelectorAll('select'))el.addEventListener('change',update);update();window.fixtureCard=card;
</script></html>
